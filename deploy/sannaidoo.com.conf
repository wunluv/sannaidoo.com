# HTTP to HTTPS redirect for sannaidoo.com
server {
    listen 80;
    listen [::]:80;
    server_name sannaidoo.com www.sannaidoo.com;

    # Let's Encrypt validation location
    location /.well-known/acme-challenge/ {
        root /var/www/public;
        allow all;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server for sannaidoo.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sannaidoo.com www.sannaidoo.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/sannaidoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sannaidoo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Document root and index files
    root /var/www/public/sannaidoo.com;
    index index.html index.htm;

    # Standard location block
    location / {
        try_files $uri $uri/ =404;
    }

    # Log files
    access_log /var/log/nginx/sannaidoo.com.access.log;
    error_log /var/log/nginx/sannaidoo.com.error.log;
}
